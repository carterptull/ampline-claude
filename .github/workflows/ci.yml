name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node scripts/syntax-check.js
      - name: Fixture tests
        run: node test/run.js

  pack:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify tarball contents
        run: node scripts/verify-pack.js
      # Regression test: packs for real and runs the installed binary
      # through its actual shebang/shim, the same path `npx ampline-claude`
      # takes — catches what a file-list-only pack check can't.
      - name: Install from the real tarball and run through the real shebang
        shell: bash
        run: |
          set -e
          npm pack
          TARBALL=$(ls ampline-claude-*.tgz)
          npm install -g "./$TARBALL"
          OUT="$(ampline-claude --version)"
          echo "version output: $OUT"
          [ -n "$OUT" ]
